<app-room-frame status="ready" [class.wheel-room--won]="result() === 'WIN'">
  <p class="wheel-room__sign">Spin to win</p>
  <div class="wheel-room__stand">
    <span class="wheel-room__pointer" aria-hidden="true"></span>
    <div
      class="wheel-room__wheel"
      [style.transform]="'rotate(' + rotation() + 'deg)'"
      (transitionend)="stopped()"
      aria-hidden="true"
    >
      @for (segment of segments; track $index) {
        <span class="wheel-room__label" [style.transform]="'rotate(' + segment.angle + 'deg)'">
          {{ segment.label }}
        </span>
      }
    </div>
  </div>
  <p class="room-words" aria-live="polite">
    @switch (result()) {
      @case ('WIN') { WINNER! }
      @case ('LOSE') { So close. You lost. }
      @default { {{ spinning() ? 'Round and round she goes…' : 'Feeling lucky?' }} }
    }
  </p>
  <button type="button" class="wheel-room__lever" [disabled]="spinning()" (click)="spin()">
    {{ result() ? 'Spin again' : 'Spin!' }}
  </button>
</app-room-frame>
