<app-room-frame [status]="trailer.status()">
  @if (trailer.value(); as t) {
    <p class="room-words room-words--small">{{ t.title }}</p>
    @if (t.url | safe; as trusted) {
      <iframe
        class="video-room__player"
        [src]="trusted"
        [title]="'Trailer for ' + t.title"
        allow="encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen
      ></iframe>
    }
    <p class="room-credit">Films from TMDB</p>
  }
</app-room-frame>
