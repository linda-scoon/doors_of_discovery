<app-room (mouseleave)="exitRoom()">
  <app-wooden-door
    (doorOpen)="enterRoom()"
    [openedDoor]="openedDoor"
    bgColor="#C3B091"
  ></app-wooden-door>
  @if (openedDoor) {
    <div class="room-container">
      <p class="title">{{ track.title }} by {{ track.artist.name }}</p>
      <div class="track">
        <img [src]="track.album.cover" [alt]="track.title" />
      </div>
      <audio controls autoplay [src]="track.preview" type="audio/mpeg"></audio>
    </div>
  }
</app-room>
