@if (open) {
  <div class="room-container">
    <p class="title">{{ track.title }} by {{ track.artist.name }}</p>
    <div class="track">
      <img [src]="track.album.cover" [alt]="track.title" />
    </div>
    <!--
      No controls. The player widget is large enough to cover the door's
      handle, and a room should sound like a room rather than show a piece
      of browser furniture. It plays by itself because you have just opened
      the door, which counts as the interaction browsers require.
    -->
    <audio autoplay [src]="track.preview" type="audio/mpeg"></audio>
  </div>
}
