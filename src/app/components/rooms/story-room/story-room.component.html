<app-room-frame status="ready">
  @if (told(); as story) {
    <p class="room-words story-room__title">{{ story.title }}</p>
    <p class="room-words room-words--small story-room__text">{{ story.text }}</p>
    <div class="story-room__actions">
      <button type="button" class="room-button" (click)="another()">Another story</button>
      <button type="button" class="room-button story-room__quiet" (click)="someoneElse()">
        Not {{ name() }}?
      </button>
    </div>
  } @else {
    <p class="room-words story-room__title">Once upon a time&hellip;</p>
    <form class="story-room__ask" (submit)="$event.preventDefault(); begin(nameInput.value)">
      <label class="room-words room-words--small" for="story-hero">Who is the hero of this story?</label>
      <input
        #nameInput
        id="story-hero"
        class="story-room__name"
        type="text"
        autocomplete="given-name"
        placeholder="Your name"
        [maxLength]="longestName"
        [value]="name()"
      />
      <button type="submit" class="room-button">Tell me a story</button>
    </form>
  }
</app-room-frame>
