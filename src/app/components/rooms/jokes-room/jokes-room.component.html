<app-room (mouseleave)="exitRoom()">
  <app-door
    [open]="openedDoor"
    (opened)="enterRoom()"
    colour="#654321"
    label="the jokes room"
  ></app-door>
  <div class="room-container">
    <p class="setup">{{ joke.setup }}</p>
    <p class="punch-line">{{ joke.delivery }}</p>
  </div>
</app-room>
