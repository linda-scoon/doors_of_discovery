<app-room-frame [status]="joke.status()">
  @if (joke.value(); as j) {
    <p class="room-words">{{ j.setup }}</p>
    @if (j.punchline) {
      <p class="room-words jokes-room__punchline">{{ j.punchline }}</p>
    }
    <p class="room-credit">
      <a href="https://jokeapi.dev/" target="_blank" rel="noopener">JokeAPI</a>
    </p>
  }
</app-room-frame>
