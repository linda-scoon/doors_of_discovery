<app-room-frame [status]="film.status()">
  @if (film.value(); as f) {
    <app-theatre-curtains></app-theatre-curtains>
    <p class="room-words room-words--small">{{ f.title }}{{ f.year ? ' (' + f.year + ')' : '' }}</p>
    <!-- Starts as the door opens and stops as it closes; see the video room. -->
    @if (open() && (f.embed | safe); as trusted) {
      <iframe
        class="film-room__screen"
        [src]="trusted"
        [title]="f.title"
        allow="autoplay; fullscreen"
        allowfullscreen
      ></iframe>
    } @else {
      <span class="film-room__screen"></span>
    }
    <p class="room-credit">
      <a [href]="f.link" target="_blank" rel="noopener">Internet Archive</a> · Prelinger Archives
    </p>
  }
</app-room-frame>
