<app-room-frame [status]="film.status()">
  @if (film.value(); as f) {
    <p class="room-words room-words--small">{{ f.title }}@if (f.year) { ({{ f.year }})}</p>
    @if (f.embed | safe; as trusted) {
      <iframe
        class="film-room__screen"
        [src]="trusted"
        [title]="f.title"
        allow="fullscreen"
        allowfullscreen
      ></iframe>
    }
    <p class="room-credit">
      <a [href]="f.link" target="_blank" rel="noopener">Internet Archive</a> · Prelinger Archives
    </p>
  }
</app-room-frame>
