<app-room-frame [status]="stations.status()">
  @if (station(); as s) {
    <div class="boombox" aria-hidden="true">
      <span class="boombox__handle"></span>
      <div class="boombox__body">
        <span class="boombox__speaker"></span>
        <div class="boombox__middle">
          <span class="boombox__display">
            <span class="boombox__live">● LIVE</span>
            @if (s.favicon) {
              <img class="boombox__logo" [src]="s.favicon" alt="" (error)="$any($event.target).hidden = true" />
            }
          </span>
          <span class="boombox__tape"><span></span><span></span></span>
          <span class="boombox__buttons"><span></span><span></span><span></span><span></span></span>
        </div>
        <span class="boombox__speaker"></span>
      </div>
    </div>
    <p class="room-words">{{ s.name }}</p>
    <p class="room-credit">
      Live from {{ s.country || 'somewhere' }}
      @if (s.homepage) {
        · <a [href]="s.homepage" target="_blank" rel="noopener">station website</a>
      }
      <br />
      <a href="https://www.radio-browser.info/" target="_blank" rel="noopener">Radio Browser</a>
    </p>
    @if (open()) {
      <!-- Tried with each station in turn; see nextStation(). -->
      <audio autoplay [src]="s.url_resolved" (error)="nextStation()"></audio>
    }
  } @else {
    <app-bricks [doorway]="true" label="This doorway is bricked up."></app-bricks>
  }
</app-room-frame>
