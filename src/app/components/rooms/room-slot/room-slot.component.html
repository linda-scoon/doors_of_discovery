<app-room (mouseleave)="closeDoor()">
  <!-- The doorway's own theatrics, behind the door so they are revealed. -->
  @if (burning) {
    <span class="doorway-fire" aria-hidden="true">
      <span class="doorway-fire__flame"></span>
      <span class="doorway-fire__flame"></span>
      <span class="doorway-fire__flame"></span>
      <span class="doorway-fire__flame"></span>
      <span class="doorway-fire__flame"></span>
    </span>
  }
  @if (lunging) {
    <span class="doorway-monster" aria-hidden="true">
      <span class="doorway-monster__eye"></span>
      <span class="doorway-monster__eye"></span>
      <span class="doorway-monster__maw"></span>
    </span>
  }

  <!-- Some doorways are curtained rather than empty. -->
  @if (hasCurtain) {
    <span
      class="doorway-curtain"
      aria-hidden="true"
      [style.--curtain-colour]="curtainColour"
    >
      <span class="doorway-curtain__half doorway-curtain__half--left"></span>
      <span class="doorway-curtain__half doorway-curtain__half--right"></span>
    </span>
  }

  <app-door
    [id]="room.id"
    [ordinal]="ordinal"
    [open]="open"
    (opened)="openDoor()"
    (tapped)="onTap($event)"
    (refused)="onRefused($event)"
    [colour]="room.colour"
    [material]="room.material"
    [openStyle]="room.openStyle"
    [handleSide]="room.handleSide"
    [label]="doorLabel"
  ></app-door>

  <!--
    The room's own contents step aside while something is happening in the
    doorway, so a jump scare is not captioned "nothing in here yet".
  -->
  <span class="room-content" [class.room-content--upstaged]="burning || lunging">
    <ng-container
      *ngComponentOutlet="room.component; inputs: contentInputs"
    ></ng-container>
  </span>
</app-room>
