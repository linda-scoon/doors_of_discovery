<app-room-frame [status]="gif.status()">
  @if (gif.value(); as g) {
    <img class="gif-room__gif" [src]="g.url" [alt]="g.title" />
    <p class="room-credit">
      @if (g.by) {
        By
        @if (g.byUrl) {
          <a [href]="g.byUrl" target="_blank" rel="noopener">{{ g.by }}</a>
        } @else {
          {{ g.by }}
        }
        ·
      }
      Powered by GIPHY
    </p>
  }
</app-room-frame>
