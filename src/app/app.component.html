<div class="app-wrapper">
  <!--
    Shuffled on every visit, and generated as the visitor scrolls. See
    src/app/wall.ts.
  -->
  @for (cell of doors; track cell.id) {
    @if (cell.bricks) {
      <app-bricks class="app-room app-bricks"></app-bricks>
    } @else {
      <app-room-slot class="app-room" [room]="cell.room" [ordinal]="cell.ordinal"></app-room-slot>
    }
  }
</div>

<!-- Crossing this asks for another dozen doors. -->
<div #endOfWall class="end-of-wall" aria-hidden="true"></div>
