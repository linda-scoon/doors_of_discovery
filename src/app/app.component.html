<div class="app-wrapper" [style.--cols]="layout.cols">
  <!--
    Shuffled on every visit, and generated as the visitor scrolls. Where each
    door goes is worked out in src/app/wall.ts, so the wall has no gaps.
  -->
  @for (door of doors; track door.room.id) {
    <app-room-slot
      class="app-room"
      [style.grid-area]="door.gridArea"
      [room]="door.room"
      [ordinal]="door.ordinal"
    ></app-room-slot>
  }
</div>

<!-- Crossing this asks for another dozen doors. -->
<div #endOfWall class="end-of-wall" aria-hidden="true"></div>

<router-outlet></router-outlet>
