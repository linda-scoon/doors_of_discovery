<div class="app-wrapper">
  <!--
    The rooms with an API behind them come first; everything after is
    generated as the visitor scrolls. See src/app/rooms.ts.
  -->
  @for (room of rooms; track room.id) {
    <app-room-slot class="app-room" [room]="room"></app-room-slot>
  }
</div>

<!-- Crossing this asks for another dozen doors. -->
<div #endOfWall class="end-of-wall" aria-hidden="true"></div>
